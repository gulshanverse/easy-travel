name: Provider Gateway CI

on:
  push:
    branches:
      - main
      - develop
      - feature/p-1.4-provider-gateway
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: gateway-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Gateway tests
        run: bun run test:gateway

      - name: Full test suite
        run: bun run test

      - name: Lint
        run: bun run lint

      - name: Production build
        run: bun run build
